name: release

# Publishes a release when a tag like v0.1.0 is pushed:
#   1. verify   - generated code in sync, tests, shell lint
#   2. archives - binaries for linux/darwin/windows x amd64/arm64 + SHA256SUMS,
#                 installers and the Docker wrapper
#   3. image    - multi-arch image ghcr.io/personal-stack/jira-cli, pushed, then
#                 pulled back by digest and smoke-tested on amd64 and arm64
#   4. publish  - the GitHub release "jiracli vX.Y.Z", created LAST, only if 1-3 succeeded. Its
#                 notes come from scripts/release-notes.sh: the version's
#                 CHANGELOG.md section, install/upgrade, downloads, checksums,
#                 the image digest. A release tag without a CHANGELOG section
#                 fails in step 1, before anything is built.
#
# Run it manually (Actions > release > Run workflow) for a dry run: everything
# is built and tested, nothing is pushed or published.
#
# Pre-release tags (containing "-", e.g. v0.2.0-rc1) are published as
# pre-releases and do not move the `latest` / `X.Y` image tags.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the dry run (nothing is published)"
        default: "v0.0.0-dryrun"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/personal-stack/jira-cli
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version format
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not vX.Y.Z[-pre]"; exit 1; }
      - name: CHANGELOG entry (releases need their notes before anything is built)
        if: env.PUBLISH == 'true' && !contains(env.VERSION, '-')
        run: scripts/release-notes.sh --check "$VERSION"
      - name: Generated code in sync
        run: go run ./cmd/jiragen check
      - name: Tests
        run: go test -race ./...
      - name: Shell lint
        run: shellcheck -s sh scripts/install.sh scripts/jira-docker.sh && shellcheck scripts/*.sh e2e/*.sh

  archives:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        run: scripts/dist.sh "$VERSION" dist
      - name: Attach installers
        run: cp scripts/install.sh dist/
      - name: Smoke test the linux/amd64 binary
        run: |
          tar -xzf dist/jira-cli_"${VERSION#v}"_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          out=$("$RUNNER_TEMP"/jira-cli_"${VERSION#v}"_linux_amd64/jiracli --version)
          echo "$out"; [[ "$out" == *"$VERSION"* ]]
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # only to smoke-test arm64; the build cross-compiles
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false            # `latest` is set explicitly below
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=Personal Stack jira-cli
            org.opencontainers.image.description=Unofficial command-line client for Jira Data Center (not affiliated with Atlassian)
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build (and push on a tag) linux/amd64 + linux/arm64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Smoke test the pushed image by digest (amd64 + arm64)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Run each platform by its OWN manifest digest, taken from the pushed
          # index. Running the index digest twice with different --platform
          # values fails on the second pull ("cannot overwrite digest").
          raw=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          for p in linux/amd64 linux/arm64; do
            d=$(jq -r --arg os "${p%/*}" --arg arch "${p#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<< "$raw")
            [[ "$d" == sha256:* && "$d" != *$'\n'* ]] || { echo "::error::no single $p manifest in $IMAGE@$DIGEST"; exit 1; }
            out=$(docker run --rm --platform "$p" "$IMAGE@$d" --version)
            echo "$p ($d): $out"; [[ "$out" == *"$VERSION"* ]]
            docker run --rm --platform "$p" "$IMAGE@$d" spec status > /dev/null
          done
      - name: Smoke test (dry run, local amd64 build)
        if: env.PUBLISH != 'true'
        run: |
          docker buildx build --platform linux/amd64 --build-arg VERSION="$VERSION" --load -t jira-cli:dryrun .
          out=$(docker run --rm jira-cli:dryrun --version); echo "$out"; [[ "$out" == *"$VERSION"* ]]

  publish:
    needs: [archives, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The merged pull requests since the previous release, as GitHub
          # lists them; release-notes.sh removes the authors from that list.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$VERSION" --jq .body > changes.md
          # What's new (CHANGELOG.md), install, upgrade, downloads, verify,
          # pull requests, docs.
          scripts/release-notes.sh "$VERSION" dist "$IMAGE" "$DIGEST" changes.md > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=(); [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          gh release create "$VERSION" dist/* --verify-tag --title "jiracli $VERSION" \
            --notes-file notes.md "${pre[@]}"
