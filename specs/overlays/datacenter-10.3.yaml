  GET /api/2/resolution/{id}:
    command: get
  GET /api/2/resolution:
    command: list
  POST /api/2/role:
    command: create
  DELETE /api/2/role/{id}:
    command: delete
  GET /api/2/role:
    command: list
  GET /api/2/role/{id}:
