  # --- requestBody.required corrections: the spec marks these bodies optional,
  # but the operations are meaningless without one. (Entries that also rename
  # a command carry body_required inline above.) ---
  POST /api/2/issue/{issueIdOrKey}/attachments:
    body_required: true
  POST /api/2/issue/{issueIdOrKey}/comment:
