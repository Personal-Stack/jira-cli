version: 1
schema_aliases:
  # Jira's Java StringList type: declared as an empty object, sent as a
  # comma-separated string (e.g. expand=renderedFields,names).
  StringList: string
rename_paths:
  - from: /api/2/filter/{id}/permission/{permission-id}
    to: /api/2/filter/{id}/permission/{permissionId}
    reason: spec defect, same resource declared with two template names (OpenAPI forbids this)
  - from: /api/2/permissionscheme/{permissionSchemeId}/attribute/{key}
    to: /api/2/permissionscheme/{permissionSchemeId}/attribute/{attributeKey}
    reason: spec defect, same resource declared with two template names (OpenAPI forbids this)
exclude:
  - method: POST
    path: /auth/1/session
    reason: cookie-based session login; the CLI authenticates with PAT/OAuth only
  - method: DELETE
    path: /auth/1/session
    reason: cookie-based session logout; not applicable to PAT/OAuth
  - method: GET
    path: /auth/1/session
    reason: cookie-based session info; use `jira auth test` instead
operations:
  DELETE /api/2/filter/{id}/permission/{permissionId}:
    params:
      permission-id:
        drop: true
        reason: spec defect, duplicate of permissionId after path rename
  PUT /api/2/permissionscheme/{permissionSchemeId}/attribute/{attributeKey}:
    params:
      key:
        rename: attributeKey
        reason: follows the path rename above
  GET /api/2/group/member:
    params:
      groupname:
        in: query
        reason: spec defect, declared as path parameter but path has no template slot
  DELETE /api/2/issuetype/{id}:
    command: delete
    params:
      alternativeIssueTypeId:
        in: query
        reason: spec defect, declared as path parameter but path has no template slot

  # --- Duplicate operationIds in the official spec (invalid OpenAPI). ---
  GET /agile/1.0/issue/{issueIdOrKey}:
    operation_id: getAgileIssue
  GET /agile/1.0/board/{boardId}/properties:
    operation_id: getBoardPropertyKeys
  GET /agile/1.0/board/{boardId}/properties/{propertyKey}:
    operation_id: getBoardProperty
  PUT /agile/1.0/board/{boardId}/properties/{propertyKey}:
    operation_id: setBoardProperty
  GET /agile/1.0/sprint/{sprintId}/properties:
    operation_id: getSprintPropertyKeys
  GET /agile/1.0/sprint/{sprintId}/properties/{propertyKey}:
    operation_id: getSprintProperty
  PUT /agile/1.0/sprint/{sprintId}/properties/{propertyKey}:
    operation_id: setSprintProperty
  DELETE /agile/1.0/sprint/{sprintId}/properties/{propertyKey}:
    operation_id: deleteSprintProperty
  GET /api/2/application-properties:
    operation_id: getApplicationProperty
  GET /api/2/comment/{commentId}/properties:
    operation_id: getCommentPropertyKeys
  PUT /api/2/comment/{commentId}/properties/{propertyKey}:
    operation_id: setCommentProperty
  GET /api/2/dashboard/{dashboardId}/items/{itemId}/properties:
    operation_id: getDashboardItemPropertyKeys
  GET /api/2/dashboard/{dashboardId}/items/{itemId}/properties/{propertyKey}:
    operation_id: getDashboardItemProperty
  PUT /api/2/dashboard/{dashboardId}/items/{itemId}/properties/{propertyKey}:
    operation_id: setDashboardItemProperty
  DELETE /api/2/dashboard/{dashboardId}/items/{itemId}/properties/{propertyKey}:
    operation_id: deleteDashboardItemProperty

  # --- Command-name collisions within a group. ---
  POST /api/2/monitoring/app:
    command: set-app-enabled
  POST /api/2/monitoring/ipd:
    command: set-ipd-enabled
  GET /api/2/priority/page:
    command: list-paginated
  POST /api/2/version/{versionId}/remotelink/{globalId}:
    command: create-or-update-remote-link-by-global-id

  # --- Curated command names (mechanical names were unclear or inconsistent). ---
  GET /api/2/search:
    group: issue
    command: search
  POST /api/2/search:
    group: issue
    command: search-post
  PUT /api/2/applicationrole/{key}:
    command: update
  PUT /api/2/applicationrole:
    command: update-bulk
  PUT /api/2/issue/{issueIdOrKey}/archive:
    command: archive
  POST /api/2/issue/archive:
    command: archive-bulk
  POST /api/2/issue:
    body_required: true
